<title>Totonoi — Legal</title>
<style>
  :root {
    --ink: #201E1D;
    --ink-soft: #5A5350;
    --amber: #A1620D;
    --rule: #E3DEDA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1.5rem 6rem;
    background: #fff;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 17px;
    line-height: 1.75;
  }
  main { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .35rem; }
  .tagline { color: var(--ink-soft); margin: 0 0 3rem; font-size: .95rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid var(--rule); }
  li:last-child { border-bottom: 1px solid var(--rule); }
  a.row {
    display: block;
    padding: 1.1rem 0;
    color: var(--amber);
    text-decoration: none;
  }
  a.row:hover, a.row:focus-visible { text-decoration: underline; }
  a.row:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  a.row span { display: block; color: var(--ink-soft); font-size: .85rem; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #F2EEEB; --ink-soft: #A39B97; --amber: #FFB35C; --rule: #3A3533; }
    body { background: #201E1D; }
  }
</style>
</head>
